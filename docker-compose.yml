services:

  postgres:
    image: postgres:16-alpine
    container_name: rentease-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-rentease_db}
      POSTGRES_USER: ${DB_USER:-rentease_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rentease_secret}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - rentease-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rentease_user} -d ${DB_NAME:-rentease_db}"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rentease-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${DB_NAME:-rentease_db}}
      DB_USER: ${DB_USER:-rentease_user}
      DB_PASSWORD: ${DB_PASSWORD:-rentease_secret}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    networks:
      - rentease-net

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


networks:
  rentease-net:
    driver: bridge


volumes:
  postgres_data:
    driver: local